<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Katalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f6f4f1; --surface:#ffffff; --ink:#1c1a17; --muted:#77716a; --line:#e7e2db; --soft:#efebe5;
  --accent:#6d2438; --accent-soft:#f3e6ea; --shadow:0 1px 2px rgba(28,26,23,.05), 0 8px 24px rgba(28,26,23,.06);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#141312; --surface:#1d1c1a; --ink:#f2eee8; --muted:#a19a91; --line:#302d29; --soft:#262421;
  --accent:#e4a3b4; --accent-soft:#3a2a2f; --shadow:none; color-scheme:dark; } }
:root[data-theme="dark"] {
  --bg:#141312; --surface:#1d1c1a; --ink:#f2eee8; --muted:#a19a91; --line:#302d29; --soft:#262421;
  --accent:#e4a3b4; --accent-soft:#3a2a2f; --shadow:none; color-scheme:dark; }
* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 Manrope, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, input, select { font:inherit; color:inherit; }
button { cursor:pointer; }
img { display:block; max-width:100%; }
.wrap { max-width:1240px; margin:0 auto; padding:0 16px; }

/* header */
.head { padding-top:28px; padding-bottom:6px; display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; }
.head h1 { margin:0; font-size:28px; font-weight:800; letter-spacing:-.02em; }
.head p { margin:2px 0 0; color:var(--muted); font-size:14px; }

/* toolbar */
.bar { position:sticky; top:0; z-index:5; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-bottom:1px solid transparent; transition:border-color .2s; }
.bar.stuck { border-bottom-color:var(--line); }
.bar .wrap { display:flex; gap:10px; align-items:center; padding-top:12px; padding-bottom:12px; flex-wrap:wrap; }
.search { flex:1 1 220px; max-width:340px; position:relative; }
.search svg { position:absolute; left:12px; top:50%; translate:0 -50%; width:16px; height:16px; stroke:var(--muted); fill:none; stroke-width:2; }
.search input { width:100%; border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:9px 14px 9px 36px; outline:none; }
.search input:focus { border-color:var(--ink); }
.chips { display:flex; gap:6px; flex-wrap:wrap; }
.chip { border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:8px 14px; font-size:14px; font-weight:600; white-space:nowrap; }
.chip[aria-pressed="true"] { background:var(--ink); color:var(--bg); border-color:var(--ink); }
.chip span { font-weight:500; opacity:.6; margin-left:4px; }
.sort { margin-left:auto; border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:8px 12px; font-size:14px; font-weight:600; }

/* grid */
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:28px 18px; padding:18px 0 48px; }
.card { border:0; background:none; padding:0; text-align:left; min-width:0; }
.ph { position:relative; aspect-ratio:1; border-radius:14px; overflow:hidden; background:var(--soft); }
.ph img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition:opacity .35s ease, transform .5s ease; }
.ph img.alt { opacity:0; }
@media (hover:hover) { .card:hover .ph img.alt { opacity:1; } .card:hover .ph img { transform:scale(1.02); } }
.badge { position:absolute; left:10px; bottom:10px; background:color-mix(in srgb, var(--surface) 92%, transparent); color:var(--ink); border-radius:999px; padding:3px 10px; font-size:12px; font-weight:600; }
.meta { padding:10px 2px 0; }
.row { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
.code { font-size:17px; font-weight:800; letter-spacing:.01em; }
.price { font-weight:700; white-space:nowrap; }
.sub { color:var(--muted); font-size:13px; margin-top:1px; }
.card:focus-visible { outline:2px solid var(--ink); outline-offset:4px; border-radius:14px; }
.empty { text-align:center; color:var(--muted); padding:60px 0; }
.foot { border-top:1px solid var(--line); color:var(--muted); font-size:13px; padding:18px 0 40px; }

/* detail */
dialog { border:0; padding:0; background:var(--surface); color:var(--ink); border-radius:20px; width:min(1060px, calc(100vw - 32px)); max-height:calc(100dvh - 32px); box-shadow:0 30px 80px rgba(0,0,0,.25); overflow:auto; }
dialog::backdrop { background:rgba(20,18,16,.45); backdrop-filter:blur(3px); }
dialog[open] { animation:pop .22s ease; }
@keyframes pop { from { opacity:0; transform:translateY(8px) scale(.99); } }
.dtop { position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:6px; padding:10px 12px; background:var(--surface); border-bottom:1px solid var(--line); }
.dtop .pos { color:var(--muted); font-size:13px; margin-right:auto; padding-left:6px; }
.ic { width:36px; height:36px; border-radius:999px; border:1px solid var(--line); background:var(--surface); display:grid; place-items:center; }
.ic svg { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.ic:hover { background:var(--soft); }
.dbody { display:grid; grid-template-columns:1.05fr 1fr; gap:28px; padding:20px; }
.media { position:sticky; top:76px; align-self:start; }
.stage { position:relative; aspect-ratio:1; border-radius:14px; overflow:hidden; background:var(--soft); }
.stage img { width:100%; height:100%; object-fit:cover; }
.stage .nav { position:absolute; top:50%; translate:0 -50%; width:38px; height:38px; border-radius:999px; border:0; background:color-mix(in srgb, var(--surface) 90%, transparent); display:grid; place-items:center; box-shadow:var(--shadow); }
.stage .nav svg { width:16px; height:16px; stroke:var(--ink); fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
.stage .prev { left:10px; } .stage .next { right:10px; }
.stage .count { position:absolute; right:10px; bottom:10px; background:color-mix(in srgb, var(--surface) 90%, transparent); border-radius:999px; padding:3px 10px; font-size:12px; font-weight:600; }
.info h2 { margin:0; font-size:34px; font-weight:800; letter-spacing:-.01em; line-height:1.1; }
.pill { display:inline-block; margin-top:8px; background:var(--accent-soft); color:var(--accent); border-radius:999px; padding:3px 11px; font-size:13px; font-weight:700; }
.desc { color:var(--muted); margin:10px 0 0; }
.sec { margin-top:22px; }
.lbl { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:8px; }
.lbl b { text-transform:none; letter-spacing:0; color:var(--ink); font-size:14px; margin-left:4px; }
.big { font-size:26px; font-weight:800; }
.ecer { color:var(--muted); margin-left:8px; }
.colors { display:grid; grid-template-columns:repeat(auto-fill, minmax(54px, 1fr)); gap:8px; }
.sw { border:2px solid transparent; border-radius:10px; padding:0; overflow:hidden; aspect-ratio:1; background:var(--soft); }
.sw img { width:100%; height:100%; object-fit:cover; }
.sw[aria-pressed="true"] { border-color:var(--ink); }
table { border-collapse:collapse; width:100%; font-size:14px; }
th, td { text-align:left; padding:8px 10px 8px 0; border-bottom:1px solid var(--line); white-space:nowrap; }
thead th { font-size:12px; color:var(--muted); font-weight:700; }
tbody th { font-weight:700; }
.tblwrap { overflow-x:auto; }
.note { color:var(--muted); font-size:12px; margin-top:8px; }
.copy { margin-top:22px; border:1px solid var(--ink); background:var(--ink); color:var(--bg); border-radius:999px; padding:11px 20px; font-weight:700; }
.copy.done { background:var(--surface); color:var(--ink); }

@media (max-width:760px) {
  .head { padding-top:20px; }
  .bar .wrap { display:grid; grid-template-columns:1fr auto; gap:10px; padding-top:10px; padding-bottom:10px; }
  .search { max-width:none; }
  .chips { grid-column:1 / -1; grid-row:2; flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; margin:0 -16px; padding:0 16px; }
  .chips::-webkit-scrollbar { display:none; }
  .head h1 { font-size:24px; }
  .sort { margin-left:0; max-width:150px; }
  .grid { grid-template-columns:repeat(2, minmax(0, 1fr)); gap:20px 12px; }
  .code { font-size:15px; } .price { font-size:14px; }
  dialog { width:100vw; max-width:100vw; height:100dvh; max-height:100dvh; border-radius:0; }
  .dbody { grid-template-columns:1fr; gap:18px; padding:0 0 28px; }
  .media { position:static; }
  .stage { border-radius:0; }
  .info { padding:0 16px; }
  .info h2 { font-size:28px; }
}
@media (prefers-reduced-motion:reduce) { * { transition:none !important; animation:none !important; } }
</style>
</head>

</dialog>

ntur mengikuti tubuh.","z":[["All Size",[["PB","46"],["LD","80–90"]]]],"pr":[["",33000,62000]],"k":[["Dusty Pink","images-07/A48__01-dusty-pink.jpg"],["Dusty Blue","images-07/A48__02-dusty-blue.jpg"],["Dark Choco","images-07/A48__03-dark-choco.jpg"],["Hitam","images-07/A48__04-hitam.jpg"]]},{"c":"A51","m":"Soft Knit","d":"Rajut lembut. Tekstur rib.","z":[["All Size",[["LD","76–86"],["PB","49"]]]],"pr":[["",33000,61500]],"k":[["Dark Choco","images-07/A51__01-dark-choco.jpg"],["Hitam","images-07/A51__02-hitam.jpg"],["Baby Blue","images-07/A51__03-baby-blue.jpg"],["Dusty Pink","images-07/A51__04-dusty-pink.jpg"]]},{"c":"A52","m":"Soft Knit","d":"Rajut lembut. Lentur mengikuti tubuh.","z":[["All Size",[["LD","76–86"],["PB","≈ 47"]]]],"pr":[["",37000,68500]],"k":[["Maron","images-07/A52__01-maron.jpg"],["Hitam","images-07/A52__02-hitam.jpg"],["Ash Brown","images-07/A52__03-ash-brown.jpg"],["Dark Choco","images-07/A52__04-dark-choco.jpg"],["Dusty Blue","images-07/A52__05-dusty-blue.jpg"],["Peach","images-07/A52__06-peach.jpg"]]},{"c":"A53","m":"Soft Knit","d":"Rajut lembut. Lentur mengikuti tubuh.","z":[["All Size",[["LD","76–86"],["P. Outer","≈ 45"],["P. Inner","≈ 38"]]]],"pr":[["",44000,79500]],"k":[["Maron","images-07/A53__01-maron.jpg"],["Hitam","images-07/A53__02-hitam.jpg"],["Ash Brown","images-07/A53__03-ash-brown.jpg"],["Dark Choco","images-07/A53__04-dark-choco.jpg"],["Dusty Blue","images-07/A53__05-dusty-blue.jpg"],["Peach","images-07/A53__06-peach.jpg"]]},{"c":"A54","m":"Soft Knit","d":"Rajut lembut. Lentur mengikuti tubuh.","z":[["All Size",[["PB","≈ 45"],["LD","≈ 76–92"]]]],"pr":[["",37000,68500]],"k":[["Dark Choco","images-07/A54__01-dark-choco.jpg"],["Hitam","images-07/A54__02-hitam.jpg"],["Dusty Blue","images-07/A54__03-dusty-blue.jpg"],["Maroon","images-07/A54__04-maroon.jpg"],["Peach","images-07/A54__05-peach.jpg"],["Ash Brown","images-07/A54__06-ash-brown.jpg"]]},{"c":"A57","m":"Soft Knit","d":"Rajut lembut.","z":[["All Size",[["LD","80–90"],["P. Badan Bagian Tengah","48"],["P. Bagian Depan/Belakang","52"]]]],"pr":[["",35000,65000]],"k":[["Maron","images-07/A57__01-maron.jpg"],["Hitam","images-07/A57__02-hitam.jpg"],["Putih","images-07/A57__03-putih.jpg"],["Dark Choco","images-07/A57__04-dark-choco.jpg"],["Dusty Pink","images-07/A57__05-dusty-pink.jpg"],["Moss Green","images-07/A57__06-moss-green.jpg"]]},{"c":"A60","m":"Soft Knit","d":"Rajut lembut.","z":[["All Size",[["LD","76–86"],["PB","≈ 47"]]]],"pr":[["",40000,73500]],"k":[["Maron","images-07/A60__01-maron.jpg"],["Hitam","images-07/A60__02-hitam.jpg"],["Ash Brown","images-07/A60__03-ash-brown.jpg"],["Dark Choco","images-07/A60__04-dark-choco.jpg"],["Dusty Blue","images-07/A60__05-dusty-blue.jpg"],["Peach","images-07/A60__06-peach.jpg"]]},{"c":"A62","m":"Soft Knit","d":"Rajut lembut.","z":[["All Size",[["LD","76–86"],["PB","≈ 50"]]]],"pr":[["",35000,65000]],"k":[["Putih","images-07/A62__01-putih.jpg"],["Dusty Pink","images-07/A62__02-dusty-pink.jpg"],["Baby Blue","images-07/A62__03-baby-blue.jpg"]]}]};
const P = DATA.p;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const rp = n => 'Rp' + n.toLocaleString('id-ID');
const minW = p => Math.min(...p.pr.map(r => r[1]));
const priceTxt = p => p.pr.length > 1 && new Set(p.pr.map(r => r[1])).size > 1 ? 'dari ' + rp(minW(p)) : rp(p.pr[0][1]);
const ico = d => `<svg viewBox="0 0 24 24"><path d="${d}"/></svg>`;

const S = { q:'', mat:'all', sort:'code' };
let shown = [], cur = -1, ci = 0;

// material chips from the data
const mats = [...new Set(P.map(p => p.m))];
$('#chips').innerHTML = [['all', 'Semua', P.length], ...mats.map(m => [m, m, P.filter(p => p.m === m).length])]
  .map(([v, t, n]) => `<button class="chip" data-m="${esc(v)}" aria-pressed="${v === 'all'}">${esc(t)}<span>${n}</span></button>`).join('');
$('#total').textContent = `${P.length} produk · ${P.reduce((a, p) => a + p.k.length, 0)} warna`;
$('#foot').innerHTML = `Harga reseller per pcs, ecer sebagai patokan. Data harga ${esc(DATA.asof)}. Ukuran dalam cm: LD = lingkar dada, PB = panjang baju, ≈ = perkiraan, toleransi 1–2 cm.`;

function render() {
  const t = S.q.trim().toLowerCase();
  shown = P.filter(p => (S.mat === 'all' || p.m === S.mat) &&
    (!t || p.c.toLowerCase().includes(t) || p.k.some(k => k[0].toLowerCase().includes(t))));
  const by = { code:(a, b) => P.indexOf(a) - P.indexOf(b), low:(a, b) => minW(a) - minW(b), high:(a, b) => minW(b) - minW(a), colors:(a, b) => b.k.length - a.k.length };
  shown.sort(by[S.sort]);
  $('#grid').innerHTML = shown.map((p, i) => {
    // when searching for a colour, lead with that colour's photo
    const hit = t ? p.k.findIndex(k => k[0].toLowerCase().includes(t)) : -1;
    const a = p.k[Math.max(hit, 0)], b = p.k[hit > 0 ? 0 : 1];
    return `<button class="card" data-i="${i}" data-c="${hit > 0 ? hit : 0}">
      <div class="ph"><img src="${esc(a[1])}" alt="${esc(p.c)} ${esc(a[0])}" loading="lazy" width="1024" height="1024">${b ? `<img class="alt" src="${esc(b[1])}" alt="" loading="lazy" width="1024" height="1024">` : ''}<span class="badge">${p.k.length} warna</span></div>
      <div class="meta"><div class="row"><span class="code">${esc(p.c)}</span><span class="price">${priceTxt(p)}</span></div>
      <div class="sub">${esc(p.m)}</div></div></button>`;
  }).join('');
  $('#empty').hidden = shown.length > 0;
}

function sizeTable(p) {
  const keys = [...new Set(p.z.flatMap(([, m]) => m.map(x => x[0])))];
  const head = `<tr><th>Ukuran</th>${keys.map(k => `<th>${esc(k)}</th>`).join('')}</tr>`;
  const body = p.z.map(([n, m]) => `<tr><th>${esc(n)}</th>${keys.map(k => { const v = m.find(x => x[0] === k); return `<td>${v ? esc(v[1]) : '–'}</td>`; }).join('')}</tr>`).join('');
  return `<div class="tblwrap"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}

function priceBlock(p) {
  if (p.pr.length === 1) return `<div><span class="big">${rp(p.pr[0][1])}</span><span class="ecer">Ecer ${rp(p.pr[0][2])}</span></div>`;
  return `<table><thead><tr><th>Ukuran</th><th>Reseller</th><th>Ecer</th></tr></thead><tbody>${p.pr.map(r => `<tr><th>${esc(r[0])}</th><td><b>${rp(r[1])}</b></td><td>${rp(r[2])}</td></tr>`).join('')}</tbody></table>`;
}

function open(i, c = 0) {
  cur = (i + shown.length) % shown.length; ci = c;
  const p = shown[cur];
  $('#pos').textContent = `${cur + 1} / ${shown.length}`;
  $('#dbody').innerHTML = `
    <div class="media"><div class="stage"><img id="main" alt="">
      ${p.k.length > 1 ? `<button class="nav prev" data-step="-1" aria-label="Warna sebelumnya">${ico('m15 18-6-6 6-6')}</button><button class="nav next" data-step="1" aria-label="Warna berikutnya">${ico('m9 18 6-6-6-6')}</button>` : ''}
      <span class="count" id="cnt"></span></div></div>
    <div class="info">
      <h2>${esc(p.c)}</h2>
      <span class="pill">${esc(p.m)}</span>
      <p class="desc">${esc(p.d)}</p>
      <div class="sec"><div class="lbl">${p.pr.length === 1 ? 'Harga reseller' : 'Harga'}</div>${priceBlock(p)}</div>
      <div class="sec"><div class="lbl">Warna <b id="cname"></b></div>
        <div class="colors">${p.k.map((k, j) => `<button class="sw" data-c="${j}" aria-label="${esc(k[0])}" title="${esc(k[0])}"><img src="${esc(k[1])}" alt="" loading="lazy"></button>`).join('')}</div></div>
      <div class="sec"><div class="lbl">Ukuran (cm)</div>${sizeTable(p)}<p class="note">≈ = perkiraan. Toleransi 1–2 cm.</p></div>
      <button class="copy" id="copy">Salin kode ${esc(p.c)}</button>
    </div>`;
  showColor(ci);
  history.replaceState(null, '', '#' + encodeURIComponent(p.c));
  const dlg = $('#dlg');
  if (!dlg.open) { dlg.showModal(); document.body.style.overflow = 'hidden'; }
  dlg.scrollTop = 0;
}

function showColor(j) {
  const p = shown[cur]; ci = (j + p.k.length) % p.k.length;
  const k = p.k[ci], img = $('#main');
  img.src = k[1]; img.alt = `${p.c} ${k[0]}`;
  $('#cname').textContent = k[0];
  $('#cnt').textContent = `${ci + 1} / ${p.k.length}`;
  document.querySelectorAll('.sw').forEach((b, n) => b.setAttribute('aria-pressed', String(n === ci)));
  // warm the neighbours so arrows feel instant
  [1, -1].forEach(d => { const n = p.k[(ci + d + p.k.length) % p.k.length]; if (n) new Image().src = n[1]; });
}

function closeDlg() { $('#dlg').close(); }
$('#dlg').addEventListener('close', () => { document.body.style.overflow = ''; history.replaceState(null, '', location.pathname + location.search); });

$('#grid').addEventListener('click', e => { const c = e.target.closest('.card'); if (c) open(+c.dataset.i, +c.dataset.c); });
$('#dbody').addEventListener('click', e => {
  const sw = e.target.closest('.sw'); if (sw) return showColor(+sw.dataset.c);
  const nv = e.target.closest('.nav'); if (nv) return showColor(ci + +nv.dataset.step);
  const cp = e.target.closest('#copy');
  if (cp) { navigator.clipboard?.writeText(shown[cur].c); cp.textContent = 'Kode disalin'; cp.classList.add('done'); setTimeout(() => { cp.textContent = 'Salin kode ' + shown[cur].c; cp.classList.remove('done'); }, 1400); }
});
$('#pPrev').onclick = () => open(cur - 1);
$('#pNext').onclick = () => open(cur + 1);
$('#close').onclick = closeDlg;
$('#dlg').addEventListener('click', e => { if (e.target === $('#dlg')) closeDlg(); });
document.addEventListener('keydown', e => {
  if (!$('#dlg').open) return;
  if (e.key === 'ArrowRight') showColor(ci + 1);
  if (e.key === 'ArrowLeft') showColor(ci - 1);
});
// swipe on the photo to change colour
let sx = null;
$('#dbody').addEventListener('touchstart', e => { if (e.target.closest('.stage')) sx = e.touches[0].clientX; }, { passive:true });
$('#dbody').addEventListener('touchend', e => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; sx = null; if (Math.abs(dx) > 40) showColor(ci + (dx < 0 ? 1 : -1)); });

$('#q').addEventListener('input', e => { S.q = e.target.value; render(); });
$('#chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  S.mat = b.dataset.m;
  document.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  render();
});
$('#sort').addEventListener('change', e => { S.sort = e.target.value; render(); });
new IntersectionObserver(([en]) => $('#bar').classList.toggle('stuck', !en.isIntersecting)).observe($('.head'));

render();
// open a product from a shared link (#A01)
const h = decodeURIComponent(location.hash.slice(1));
if (h) { const i = shown.findIndex(p => p.c.toLowerCase() === h.toLowerCase()); if (i >= 0) open(i); }
</script>
